name: Update administrative boundaries

on:
  schedule:
    - cron: "23 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: boundary-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh administrative boundaries
        run: python -u scripts/update_boundaries.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required = [
              "data/countries.geojson",
              "data/countries.json",
              "data/province.json",
              "data/district-index.json",
              "data/boundary-manifest.json",
              "data/boundary-update-report.json",
          ]
          for filename in required:
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"Missing output: {filename}")
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK {filename}: {path.stat().st_size:,} bytes")
          index = json.loads(Path("data/district-index.json").read_text(encoding="utf-8"))
          missing = []
          for item in index.get("countries", {}).values():
              path = Path("data") / item["file"]
              if not path.exists():
                  missing.append(str(path))
          if missing:
              raise SystemExit("Missing indexed district files: " + ", ".join(missing[:20]))
          print(f"OK district files: {len(index.get('countries', {}))} country datasets")
          PY

      - name: Commit changes if data changed
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+AnggaConni@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): refresh administrative boundaries"
            git push
          else
            echo "Boundary data unchanged."
          fi
