name: Validate JavaScript syntax

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "api.js"
      - "tests/crop-api.test.js"
      - ".github/workflows/validate-app.yml"
  pull_request:
    paths:
      - "app.js"
      - "api.js"
      - ".github/workflows/validate-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check application JavaScript syntax
        run: |
          node --check app.js
          node --check api.js
          node --check tests/crop-api.test.js
          echo "JavaScript syntax is valid."

      - name: Smoke test crop screener and photo API mapping
        run: node tests/crop-api.test.js
